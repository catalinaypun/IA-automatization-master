<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valu Cal Existing Accounts</title>
</head>
<body>
  <script>
    (function () {
      var target = new URL('./app/demos/valucal_existing_accounts.html', window.location.href);
      var current = new URL(window.location.href);

      current.searchParams.forEach(function (value, key) {
        target.searchParams.set(key, value);
      });

      if (!target.searchParams.get('presenter')) {
        target.searchParams.set('presenter', 'true');
      }

      if (!target.searchParams.get('state')) {
        target.searchParams.set('state', 'default');
      }

      window.location.replace(target.toString());
    }());
  </script>
  <noscript>
    <p>
      JavaScript is required. Open
      <a href="./app/demos/valucal_existing_accounts.html?presenter=true&state=default">the main app screen</a>.
    </p>
  </noscript>
</body>
</html>
