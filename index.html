<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype Viewer — Verizon C360</title>
  <link rel="stylesheet" href="./assets/ds/design-system.css">
</head>
<body style="display:flex;height:100vh;overflow:hidden;background:var(--color-gray-100);">

  <!-- ============================================================
       EMBEDDED MANIFEST — keep in sync with flow.json
       Rule: every task that updates flow.json must also update this block.
  ============================================================ -->
  <script type="application/json" id="flow-manifest">
{

    { "id": "pricing-manager", "name": "Pricing Manager", "accent": "#006fc0" },
    { "id": "reconciliation", "name": "Reconciliation", "accent": "#008331" },

  ],
  "flows": [

      "name": "Modifications",

      "status": "draft",
      "updated": "2026-07-01",
      "path": "flows/modifications/index.html",
      "requirements": "flows/modifications/requirements.html",
      "changelog": "flows/modifications/CHANGELOG.html",

      "changelog": "flows/promotions-management-poc/CHANGELOG.html",

    },
    {
      "id": "promotions-management-poc-v2",
      "project": "pricing-manager",
      "name": "Pricing Desk V2",
      "description": "Versioned workspace for major navigation and architecture changes.",
      "status": "draft",
      "updated": "2026-07-22",
      "path": "flows/promotions-management-poc-v2/index.html",
      "requirements": "flows/promotions-management-poc-v2/requirements.html",
      "changelog": "flows/promotions-management-poc-v2/CHANGELOG.html",
      "states": ["default", "loading", "validation-error", "system-error"]

    {
      "id": "valucal-mvp",

      "name": "Valu Cal MVP",
      "description": "Valu Cal MVP flow integrated in ecosystem structure with local launch screen and docs.",
      "status": "draft",
      "updated": "2026-07-10",
      "path": "flows/valucal-mvp/index.html",
      "requirements": "flows/valucal-mvp/requirements.html",
      "changelog": "flows/valucal-mvp/CHANGELOG.html",
      "states": ["default", "loading", "validation-error"]
    },
    {
      "id": "valucal-growth",
      "project": "valucal",
      "name": "Valu Cal Growth",
      "description": "Valu Cal Growth flow integrated in ecosystem structure with local launch screen and docs.",
      "status": "draft",
      "updated": "2026-07-10",
      "path": "flows/valucal-growth/index.html",
      "requirements": "flows/valucal-growth/requirements.html",
      "changelog": "flows/valucal-growth/CHANGELOG.html",
      "states": ["default", "loading", "validation-error"]
    },
    {
      "id": "valucal-existing-accounts",
      "project": "valucal",
      "name": "Valu Cal Existing Accounts",
      "description": "Valu Cal Existing Accounts flow integrated in ecosystem structure with local launch screen and docs.",
      "status": "draft",
      "updated": "2026-07-10",
      "path": "flows/valucal-existing-accounts/index.html",
      "requirements": "flows/valucal-existing-accounts/requirements.html",
      "changelog": "flows/valucal-existing-accounts/CHANGELOG.html",
      "states": ["default", "loading", "validation-error"]
    },
    {
      "id": "reconciliation",
      "project": "reconciliation",
      "name": "Reconciliation",
      "description": "Initial reconciliation workspace scaffold with baseline states and documentation.",
      "status": "draft",
      "updated": "2026-07-21",
      "path": "flows/reconciliation/index.html",
      "requirements": "flows/reconciliation/requirements.html",

    {
      "id": "upsells",

      "name": "Upsells",
      "description": "Salesforce-native Opportunity Capture tab for an Upsell/Blended order — select existing vehicles for upsell lines, enter new VINs for expansion lines, and surface hardware compatibility results. Built with SLDS.",

  </script>

  <!-- ============================================================
       SIDEBAR
  ============================================================ -->
  <aside id="sidebar" style="width:220px;min-width:220px;background:var(--color-white);border-right:1px solid var(--color-border);display:flex;flex-direction:column;overflow-y:auto;">

    <!-- Logo -->
    <div style="padding:16px 16px 12px;border-bottom:1px solid var(--color-border);">
      <div style="display:flex;align-items:center;gap:8px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect width="24" height="24" rx="4" fill="#e10014"/>
          <path d="M6 7h12l-6 10L6 7z" fill="#fff"/>
        </svg>
        <span class="text-body-medium-bold" style="color:var(--color-gray-1100);">Prototypes</span>
      </div>
    </div>

    <!-- Nav -->
    <nav style="flex:1;padding:8px 0;" aria-label="Projects">

      <div style="padding:8px 16px 6px;">
        <span class="text-body-small-bold" style="color:var(--color-gray-400);text-transform:uppercase;letter-spacing:.07em;">Libraries</span>
      </div>

      <a href="assets/ds/index.html" target="_blank" rel="noopener"
        style="width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:7px 16px;display:flex;align-items:center;gap:8px;border-radius:0;text-decoration:none;color:inherit;">
        <span class="badge badge--red">DS</span>
        <span class="text-body-medium">Design System</span>
      </a>

      <a href="custom-components/index.html" target="_blank" rel="noopener"
        style="width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:7px 16px;display:flex;align-items:center;gap:8px;border-radius:0;text-decoration:none;color:inherit;">
        <span class="badge badge--blue">CC</span>
        <span class="text-body-medium">Custom Library</span>
      </a>

      <div style="margin:6px 16px 2px;border-bottom:1px solid var(--color-border);"></div>

      <button id="nav-all" data-nav="all"
        style="width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:7px 16px;display:flex;align-items:center;gap:8px;border-radius:0;">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" style="flex-shrink:0;">
          <rect x="0" y="0" width="6" height="6" rx="1" fill="currentColor"/>
          <rect x="8" y="0" width="6" height="6" rx="1" fill="currentColor"/>
          <rect x="0" y="8" width="6" height="6" rx="1" fill="currentColor"/>
          <rect x="8" y="8" width="6" height="6" rx="1" fill="currentColor"/>
        </svg>
        <span class="text-body-medium">All Projects</span>
      </button>

      <div style="padding:12px 16px 4px;">
        <span class="text-body-small-bold" style="color:var(--color-gray-400);text-transform:uppercase;letter-spacing:.07em;">Projects</span>
      </div>

      <div id="project-nav"></div>

    </nav>

  </aside>

  <!-- ============================================================
       CONTENT
  ============================================================ -->
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">

    <!-- Top bar -->
    <header style="background:var(--color-white);border-bottom:1px solid var(--color-border);padding:12px 24px;display:flex;align-items:center;gap:12px;min-height:52px;">
      <h1 id="content-title" class="text-title-2xsmall" style="margin:0;font-weight:700;"></h1>
      <span id="content-count" class="badge badge--gray-low" style="display:none;"></span>
    </header>

    <!-- Scrollable grid area -->
    <main style="flex:1;overflow-y:auto;padding:24px;">
      <div id="flow-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;"></div>
      <div id="empty-state" style="display:none;text-align:center;padding:80px 0;">
        <p class="text-title-xsmall" style="color:var(--color-gray-400);margin:0 0 8px;">No flows in this project</p>
        <p class="text-body-medium" style="color:var(--color-gray-600);">Add a flow to <code>flow.json</code> with this project id.</p>
      </div>
    </main>

  </div>

  <!-- ============================================================
       SCRIPT — no fetch() calls; reads embedded manifest only
  ============================================================ -->
  <script>
    var STATUS_BADGE = {
      'draft':     { cls: 'badge--gray-low', label: 'Draft'     },
      'in-review': { cls: 'badge--yellow',   label: 'In Review' },
      'approved':  { cls: 'badge--green',    label: 'Approved'  },
    };

    // ── Read manifest ────────────────────────────────────────────
    var manifest    = JSON.parse(document.getElementById('flow-manifest').textContent);
    var allProjects = manifest.projects || [];
    var allFlows    = manifest.flows    || [];

    // ── Project accent lookup ────────────────────────────────────
    var projectMap = {};
    allProjects.forEach(function (p) { projectMap[p.id] = p; });

    // ── Active project state ─────────────────────────────────────
    var activeProject = 'all';

    // ── Sidebar nav items ────────────────────────────────────────
    var projectNav = document.getElementById('project-nav');
    allProjects.forEach(function (p) {
      var btn = document.createElement('button');
      btn.dataset.nav = p.id;
      btn.style.cssText = 'width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:7px 16px;display:flex;align-items:center;gap:8px;border-radius:0;';
      btn.innerHTML =
        '<span style="width:10px;height:10px;border-radius:50%;background:' + p.accent + ';flex-shrink:0;display:inline-block;"></span>' +
        '<span class="text-body-medium">' + p.name + '</span>';
      btn.addEventListener('click', function () { setActive(p.id); });
      projectNav.appendChild(btn);
    });

    // ── Nav active style helpers ──────────────────────────────────
    function setNavStyle(btn, isActive) {
      btn.style.background   = isActive ? 'var(--color-gray-100)' : 'none';
      btn.style.fontWeight   = isActive ? '700' : '';
      btn.querySelector('span:last-child').style.fontWeight = isActive ? '700' : '400';
    }

    // ── Render flows for active project ──────────────────────────
    function renderFlows(projectId) {
      var flows  = projectId === 'all'
        ? allFlows
        : allFlows.filter(function (f) { return f.project === projectId; });

      var grid   = document.getElementById('flow-grid');
      var empty  = document.getElementById('empty-state');
      var title  = document.getElementById('content-title');
      var count  = document.getElementById('content-count');

      grid.innerHTML = '';

      // Title
      if (projectId === 'all') {
        title.textContent = 'All Projects';
      } else {
        var proj = projectMap[projectId];
        title.textContent = proj ? proj.name : projectId;
      }

      // Count badge
      if (flows.length > 0) {
        count.textContent = flows.length + (flows.length === 1 ? ' flow' : ' flows');
        count.style.display = '';
      } else {
        count.style.display = 'none';
      }

      if (flows.length === 0) {
        empty.style.display = '';
        return;
      }
      empty.style.display = 'none';

      flows.forEach(function (flow) {
        grid.appendChild(makeCard(flow));
      });
    }

    // ── Card factory ─────────────────────────────────────────────
    function makeCard(flow) {
      var badge   = STATUS_BADGE[flow.status] || { cls: 'badge--gray', label: flow.status };
      var proj    = projectMap[flow.project]  || null;
      var accent  = proj ? proj.accent : 'var(--color-gray-600)';

      var card = document.createElement('div');
      card.style.cssText = 'background:var(--color-white);border-radius:var(--radius-400);overflow:hidden;border:1px solid var(--color-border);display:flex;flex-direction:column;transition:box-shadow .15s;cursor:pointer;';
      card.addEventListener('mouseenter', function () { card.style.boxShadow = '0 4px 16px rgba(0,0,0,.12)'; });
      card.addEventListener('mouseleave', function () { card.style.boxShadow = 'none'; });

      // ── Thumbnail ──
      var thumb = document.createElement('div');
      thumb.style.cssText = 'background:var(--color-gray-1100);padding:16px;display:flex;flex-direction:column;justify-content:space-between;min-height:160px;border-radius:calc(var(--radius-400) - 1px) calc(var(--radius-400) - 1px) 0 0;';

      // Top row: project label left, status badge right
      var thumbTop = document.createElement('div');
      thumbTop.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:8px;';
      thumbTop.innerHTML =
        '<span class="text-body-small-bold" style="color:' + accent + ';text-transform:uppercase;letter-spacing:.07em;">' + (proj ? proj.name : '') + '</span>' +
        '<span class="badge ' + badge.cls + '">' + badge.label + '</span>';
      thumb.appendChild(thumbTop);

      // Bottom: flow name + updated date
      var thumbBottom = document.createElement('div');
      thumbBottom.style.cssText = 'display:flex;flex-direction:column;gap:4px;';
      thumbBottom.innerHTML =
        '<span class="text-title-xsmall" style="color:var(--color-white);font-weight:700;word-break:break-word;">' + flow.name + '</span>' +
        '<span class="text-body-small" style="color:var(--color-gray-400);">Updated ' + (flow.updated || '—') + '</span>';
      thumb.appendChild(thumbBottom);

      card.appendChild(thumb);

      // ── Card body (actions only) ──
      var body = document.createElement('div');
      body.style.cssText = 'padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;';

      // Action links
      var actions = document.createElement('div');
      actions.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin-top:4px;';

      var openBtn = document.createElement('a');
      openBtn.href = flow.path;
      openBtn.target = '_blank';
      openBtn.rel = 'noopener';
      openBtn.className = 'btn btn--primary btn--medium';
      openBtn.style.cssText = 'width:100%;text-align:center;box-sizing:border-box;display:block;';
      openBtn.textContent = 'Open';
      actions.appendChild(openBtn);

      var secondary = document.createElement('div');
      secondary.style.cssText = 'display:flex;gap:8px;';

      if (flow.requirements) {
        var reqLink = document.createElement('a');
        reqLink.href = flow.requirements;
        reqLink.target = '_blank';
        reqLink.rel = 'noopener';
        reqLink.className = 'btn btn--secondary btn--small';
        reqLink.style.cssText = 'flex:1;text-align:center;box-sizing:border-box;';
        reqLink.textContent = 'Requirements';
        secondary.appendChild(reqLink);
      }
      if (flow.changelog) {
        var logLink = document.createElement('a');
        logLink.href = flow.changelog;
        logLink.target = '_blank';
        logLink.rel = 'noopener';
        logLink.className = 'btn btn--secondary btn--small';
        logLink.style.cssText = 'flex:1;text-align:center;box-sizing:border-box;';
        logLink.textContent = 'Changelog';
        secondary.appendChild(logLink);
      }

      if (secondary.children.length) actions.appendChild(secondary);
      body.appendChild(actions);
      card.appendChild(body);
      return card;
    }

    // ── Navigation ────────────────────────────────────────────────
    function setActive(projectId) {
      activeProject = projectId;

      // Update all nav button styles
      document.querySelectorAll('[data-nav]').forEach(function (btn) {
        setNavStyle(btn, btn.dataset.nav === projectId);
      });

      renderFlows(projectId);
    }

    // ── Wire "All Projects" button ────────────────────────────────
    document.getElementById('nav-all').addEventListener('click', function () {
      setActive('all');
    });

    // ── Boot ─────────────────────────────────────────────────────
    setActive('all');
  </script>

</body>
</html>
